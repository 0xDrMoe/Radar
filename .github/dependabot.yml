# Weekly pull requests for vulnerable or outdated dependencies and GitHub Actions. Each one runs
# CI like any other pull request and is merged by a maintainer, never automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
